name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Test + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: dist/ is in sync with source (build is committed)
        run: npm run check:dist

      - name: README table is in sync with catalog
        run: npm run check:readme

      - name: Syntax check build scripts
        run: for f in scripts/*.mjs; do node --check "$f"; done
